<div class="container py-4">
  <div class="col-lg-10 col-xl-8 mx-auto">
    <div class="card shadow-sm">
      <div class="card-header d-flex flex-wrap gap-2 justify-content-between align-items-center">
        <div>
          <h5 class="mb-0">Edit FAQ</h5>
          <small class="text-muted">Update the question or refine its answer.</small>
        </div>
        <button type="button" class="btn btn-link text-decoration-none" (click)="onCancel()">Back to list</button>
      </div>
      <div class="card-body">
        <ng-container *ngIf="!loadError; else errorState">
          <form [formGroup]="faqForm" (ngSubmit)="onSubmit()" novalidate>
              <div class="mb-3">
                <label for="faqQuestion" class="form-label">Question</label>
                <input
                  id="faqQuestion"
                  type="text"
                  class="form-control"
                  placeholder="What would you like to ask?"
                  formControlName="question"
                  [class.is-invalid]="isSubmitted && controls.question.invalid"
                />
                <div class="invalid-feedback" *ngIf="isSubmitted && controls.question.errors?.['required']">Question is required.</div>
              </div>

              <div class="mb-3">
                <label class="form-label">Answer</label>
                <ngx-editor-menu [editor]="editor" [toolbar]="toolbar"></ngx-editor-menu>
                <ngx-editor
                  formControlName="answer"
                  [editor]="editor"
                  placeholder="Provide a detailed answer..."
                  [ngClass]="{ 'is-invalid': isSubmitted && controls.answer.invalid }"
                ></ngx-editor>
                <div class="text-danger small mt-1" *ngIf="isSubmitted && controls.answer.errors?.['required']">Answer is required.</div>
              </div>

              <div class="form-check form-switch mb-4">
                <input class="form-check-input" type="checkbox" id="faqActive" formControlName="is_active" />
                <label class="form-check-label" for="faqActive">
                  Publish immediately
                  <small class="text-muted d-block">Uncheck to keep this FAQ inactive.</small>
                </label>
              </div>

              <div class="d-flex justify-content-end gap-2">
                <button type="button" class="btn btn-outline-secondary" (click)="onCancel()">Cancel</button>
                <button type="submit" class="btn btn-primary" [disabled]="isSubmitting">
                  <span class="spinner-border spinner-border-sm me-2" *ngIf="isSubmitting" aria-hidden="true"></span>
                  Update FAQ
                </button>
              </div>

              <div class="text-danger mt-3" *ngIf="apiError">{{ apiError }}</div>
            </form>
        </ng-container>

          <ng-template #errorState>
            <div class="text-center py-4">
              <p class="text-danger mb-3">{{ loadError }}</p>
              <button class="btn btn-outline-primary" type="button" (click)="onCancel()">Back to list</button>
            </div>
          </ng-template>
      </div>
      </div>
    </div>
  </div>
